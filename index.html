<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiffin Tales | Order Online</title>
  <meta name="description" content="Order home-style South Indian food online from Tiffin Tales, Coimbatore. Browse 12 dishes, apply coupons and get it delivered hot." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>

  <!-- ═══════════════════ HEADER ═══════════════════ -->
  <header class="site-header">
    <div class="brand">
      <span class="logo">TT</span>
      <div>
        <h1>Tiffin Tales</h1>
        <p class="tagline">Home-style South Indian food, delivered hot</p>
      </div>
    </div>
    <a class="cart-link" href="#cart">
      Cart <span id="cart-count">0</span>
    </a>
  </header>

  <!-- ═══════════════════ HERO BANNER ═══════════════════ -->
  <section class="hero">
    <h2>Hungry? Order in three taps.</h2>
    <p>Free delivery above ₹499. Use code <b>TIFFIN10</b> for 10% off.</p>
  </section>

  <!-- ═══════════════════ MAIN LAYOUT ═══════════════════ -->
  <main class="layout">

    <!-- ── Menu Area ── -->
    <section class="menu-area">

      <!-- Search / Sort / Veg toolbar -->
      <div class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="Search dishes…"
          aria-label="Search dishes"
        />
        <select id="sort" aria-label="Sort dishes">
          <option value="default">Sort by: Default</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="rating">Top Rated</option>
        </select>
        <label class="veg-toggle">
          <input id="veg-only" type="checkbox" />
          Veg only
        </label>
      </div>

      <!-- Category chips -->
      <div class="chips" id="chips">
        <button class="chip active" data-cat="all">All</button>
        <button class="chip" data-cat="breakfast">Breakfast</button>
        <button class="chip" data-cat="meals">Meals</button>
        <button class="chip" data-cat="snacks">Snacks</button>
        <button class="chip" data-cat="drinks">Drinks</button>
      </div>

      <!-- Result info & grid -->
      <p class="result-info" id="result-info"></p>
      <ul class="menu-grid" id="menu-grid"></ul>

    </section>

    <!-- ── Cart Aside ── -->
    <aside class="cart" id="cart">
      <h2>Your order</h2>
      <ul class="cart-list" id="cart-list"></ul>

      <!-- Coupon form -->
      <form class="coupon-form" id="coupon-form" novalidate>
        <input id="coupon-input" type="text" placeholder="Coupon code" aria-label="Coupon code" />
        <button type="submit">Apply</button>
      </form>
      <p class="coupon-msg" id="coupon-msg"></p>

      <!-- Bill breakdown -->
      <dl class="bill" id="bill"></dl>

      <!-- Checkout / Delivery form -->
      <form class="checkout-form" id="checkout-form" novalidate>
        <h3>Delivery details</h3>

        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="e.g. Ravi Kumar" autocomplete="name" />
        <small class="error" data-error-for="name"></small>

        <label for="phone">Phone number</label>
        <input id="phone" type="tel" inputmode="numeric" placeholder="10-digit mobile number" autocomplete="tel" />
        <small class="error" data-error-for="phone"></small>

        <label for="address">Delivery address</label>
        <textarea id="address" rows="2" placeholder="House / flat, street, area…" autocomplete="street-address"></textarea>
        <small class="error" data-error-for="address"></small>

        <button class="place-btn" id="place-btn" type="submit">Place order</button>
      </form>
    </aside>

  </main>

  <!-- ═══════════════════ ORDER CONFIRMATION POPUP ═══════════════════ -->
  <section class="confirmation" id="confirmation" hidden></section>

  <!-- ═══════════════════ FOOTER ═══════════════════ -->
  <footer class="site-footer">
    © 2026 Tiffin Tales · Built by Thirupathi
  </footer>

</body>
</html>
